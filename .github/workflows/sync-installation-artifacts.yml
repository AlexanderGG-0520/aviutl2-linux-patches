name: Sync installation artifact preparation

on:
  issues:
    types:
      - opened

permissions:
  contents: write

jobs:
  sync:
    if: github.event.issue.title == 'internal: apply installation artifact documentation payload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the reviewed INSTALLATION.md
        shell: bash
        run: |
          set -Eeuo pipefail
          base64 --decode .github/INSTALLATION.md.gz.b64 \
            | gzip --decompress \
            > docs/INSTALLATION.md

          printf '%s  %s\n' \
            '3fd3dddfa26ea414993e06366fd90a52aefc5145eddd4fe663e3f1fb4a525033' \
            'docs/INSTALLATION.md' \
            | sha256sum --check -

          grep -Fq '## 2.2 patched DXVKをbuildする' docs/INSTALLATION.md
          grep -Fq '## 2.4 日本語フォントを取得・生成する' docs/INSTALLATION.md
          grep -Fq '## 2.5 NVIDIA Wine wrapperを取得する' docs/INSTALLATION.md
          grep -Fq '固定名の`av1-main10-test.mp4`は要求しない。' docs/INSTALLATION.md
          ! grep -Fq '$AV1_TEST_FILE' docs/INSTALLATION.md
          ! grep -Fq '$NVENC_TEST_OUTPUT' docs/INSTALLATION.md

      - name: Commit the documentation update and remove staging files
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f \
            .github/INSTALLATION.md.gz.b64 \
            .github/workflows/sync-installation-artifacts.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/INSTALLATION.md \
            .github/INSTALLATION.md.gz.b64 \
            .github/workflows/sync-installation-artifacts.yml
          git commit -m 'docs: add missing artifact preparation steps'
          git push origin HEAD:main
