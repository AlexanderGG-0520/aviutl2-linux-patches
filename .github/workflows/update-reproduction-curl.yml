name: Update reproduction guide with curl install

on:
  push:
    paths:
      - .github/workflows/update-reproduction-curl.yml

permissions:
  contents: write

jobs:
  update-guide:
    if: github.event.head_commit.message == 'Add one-shot curl documentation updater'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update REPRODUCTION.md
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/REPRODUCTION.md")
          text = path.read_text(encoding="utf-8")

          old_packages = """sudo pacman -S --needed \\
              base-devel \\
              git \\
"""
          new_packages = """sudo pacman -S --needed \\
              base-devel \\
              curl \\
              git \\
"""

          old_section = """## 6. Wine prefix と AviUtl2

          prefix:

          ```fish
          set PREFIX "$ROOT/prefix-ge-nvdec-test"
          ```

          AviUtl2 は最終的に次へ配置する。

          ```text
          $PREFIX/drive_c/AviUtl2/aviutl2.exe
          ```

          Windows 側から見たパス:

          ```text
          C:\\AviUtl2
          ```

          AviUtl2 本体の入手と利用条件は公式配布元に従う。
"""

          new_section = """## 6. Wine prefix と AviUtl2

          ### 6.1 prefix と GE-Proton のコマンドを設定

          ```fish
          set PREFIX "$ROOT/prefix-ge-nvdec-test"

          set GE_WINE \\
              "$GE_TEST/files/lib/wine/x86_64-unix/wine"

          set GE_WINESERVER \\
              "$GE_TEST/files/bin/wineserver"

          set GE_LIBS \\
              "$GE_TEST/files/lib64:$GE_TEST/files/lib:$GE_TEST/files/lib/wine/x86_64-unix:$GE_TEST/files/lib/wine/i386-unix"
          ```

          ### 6.2 公式インストーラを `curl` で取得

          再現性を優先し、検証時に使用した AviUtl2 2.1.2 を固定して取得する。
          新しいバージョンへ変更する場合は、公式配布ページを確認して
          `AVIUTL2_VERSION` を更新する。

          ```fish
          set AVIUTL2_VERSION "2.1.2"
          set AVIUTL2_FILENAME (string join '' \\
              "AviUtl2_v" "$AVIUTL2_VERSION" "_setup.exe")

          set DOWNLOAD_DIR "$ROOT/downloads"
          set AVIUTL2_INSTALLER "$DOWNLOAD_DIR/$AVIUTL2_FILENAME"
          set AVIUTL2_PART (string join '' "$AVIUTL2_INSTALLER" ".part")
          set AVIUTL2_URL \\
              "https://spring-fragrance.mints.ne.jp/aviutl/$AVIUTL2_FILENAME"

          mkdir -p "$DOWNLOAD_DIR"

          curl \\
              --fail \\
              --location \\
              --retry 3 \\
              --retry-delay 2 \\
              --output "$AVIUTL2_PART" \\
              "$AVIUTL2_URL"

          mv \\
              "$AVIUTL2_PART" \\
              "$AVIUTL2_INSTALLER"

          file "$AVIUTL2_INSTALLER"
          ```

          `curl` が HTTP エラーを返した場合は、壊れたファイルを完成品として扱わず、
          `.part` のまま残る。公式配布ページでバージョンとURLを確認してから再実行する。

          ### 6.3 インストーラを同じ prefix で実行

          ```fish
          env \\
              WINEPREFIX="$PREFIX" \\
              LD_LIBRARY_PATH="$GE_LIBS" \\
              WINEDEBUG=-all \\
              "$GE_WINE" \\
              "$AVIUTL2_INSTALLER"
          ```

          セットアップ画面では、インストール先を次にする。

          ```text
          C:\\AviUtl2
          ```

          インストール完了後の実体:

          ```text
          $PREFIX/drive_c/AviUtl2/aviutl2.exe
          ```

          確認:

          ```fish
          if test -f "$PREFIX/drive_c/AviUtl2/aviutl2.exe"
              echo "OK: AviUtl2 installed"
          else
              echo "ERROR: aviutl2.exe was not found"
          end
          ```

          AviUtl2 本体の利用条件は公式配布元に従う。
"""

          if old_packages not in text:
              raise SystemExit("package block not found")
          if old_section not in text:
              raise SystemExit("section 6 block not found")

          text = text.replace(old_packages, new_packages, 1)
          text = text.replace(old_section, new_section, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit documentation update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/REPRODUCTION.md
          git diff --cached --check
          git commit -m "Document curl-based AviUtl2 installation"
          git push
