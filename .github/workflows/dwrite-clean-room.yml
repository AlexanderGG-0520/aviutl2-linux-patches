name: DWrite clean-room build

on:
  push:
    paths:
      - 'patches/wine/**'
      - 'scripts/build-dwrite-clean-room.sh'
      - '.github/workflows/dwrite-clean-room.yml'
  pull_request:
    paths:
      - 'patches/wine/**'
      - 'scripts/build-dwrite-clean-room.sh'
      - '.github/workflows/dwrite-clean-room.yml'
  workflow_dispatch:

jobs:
  build-dwrite:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            bison \
            build-essential \
            file \
            flex \
            git \
            libtool \
            mingw-w64 \
            pkg-config

      - name: Validate shell syntax
        run: bash -n scripts/build-dwrite-clean-room.sh

      - name: Build DWrite from an empty workspace
        run: |
          bash scripts/build-dwrite-clean-room.sh \
            --work-dir "$RUNNER_TEMP/dwrite-clean-room" \
            --output-dir "$RUNNER_TEMP/dwrite-output" \
            --jobs "$(nproc)"

      - name: Verify artifact
        run: |
          test -f "$RUNNER_TEMP/dwrite-output/dwrite.dll"
          test -f "$RUNNER_TEMP/dwrite-output/SHA256SUMS"
          test -f "$RUNNER_TEMP/dwrite-output/BUILD-METADATA.txt"
          cd "$RUNNER_TEMP/dwrite-output"
          sha256sum -c SHA256SUMS

      - name: Upload DWrite artifact
        uses: actions/upload-artifact@v4
        with:
          name: clean-room-dwrite
          path: |
            ${{ runner.temp }}/dwrite-output/dwrite.dll
            ${{ runner.temp }}/dwrite-output/SHA256SUMS
            ${{ runner.temp }}/dwrite-output/BUILD-METADATA.txt
